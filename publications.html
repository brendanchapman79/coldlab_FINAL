<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>publications · Cold Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/site.js"></script>
</head>
<body>
<div id="nav-placeholder"></div>
<main class="container">
  <div class="page-header">
    <h1>publications</h1>
  </div>
  <div id="pubs"></div>
</main>
<div id="footer-placeholder"></div>
<script>
  injectPartial('nav-placeholder', 'partials/nav.html');
  injectPartial('footer-placeholder', 'partials/footer.html');

  const ORCID_ID = '0000-0001-7518-6645';

  async function loadORCIDPublications() {
    const pubsEl = document.getElementById('pubs');

    try {
      // Get works summary
      const worksRes = await fetch(
        `https://pub.orcid.org/v3.0/${ORCID_ID}/works`,
        {
          headers: {
            Accept: 'application/json'
          }
        }
      );

      const worksData = await worksRes.json();

      const groups = worksData.group || [];

      if (groups.length === 0) {
        pubsEl.innerHTML = '<p>No publications found.</p>';
        return;
      }

      // Build publication list
      const publications = await Promise.all(
        groups.map(async group => {
          const summary = group['work-summary'][0];

          const putCode = summary['put-code'];

          // Fetch full record for richer metadata
          const detailRes = await fetch(
            `https://pub.orcid.org/v3.0/${ORCID_ID}/work/${putCode}`,
            {
              headers: {
                Accept: 'application/json'
              }
            }
          );

          const detail = await detailRes.json();

          return {
            title:
              detail.title?.title?.value ||
              'Untitled',

            year:
              detail['publication-date']?.year?.value ||
              '—',

            journal:
              detail['journal-title']?.value ||
              '',

            doi:
              detail['external-ids']?.['external-id']
                ?.find(id => id['external-id-type'] === 'doi')
                ?.['external-id-value'] || null
          };
        })
      );

      // Sort newest first
      publications.sort((a, b) => b.year - a.year);

      // Render
      pubsEl.innerHTML = publications.map(p => `
        <div class="card" style="margin-bottom:16px">
          <strong>${p.title}</strong>

          <div style="color:#aaa;font-size:0.85rem;margin-top:4px">
            ${p.year}${p.journal ? ' · ' + p.journal : ''}
          </div>

          ${
            p.doi
              ? `<div style="margin-top:8px">
                  <a href="https://doi.org/${p.doi}" target="_blank">
                    https://doi.org/${p.doi}
                  </a>
                </div>`
              : ''
          }
        </div>
      `).join('');

    } catch (err) {
      console.error('Failed to load ORCID publications:', err);

      pubsEl.innerHTML = `
        <div class="card">
          Could not load publications.
        </div>
      `;
    }
  }

  loadORCIDPublications();
</script>
</body>
</html>
